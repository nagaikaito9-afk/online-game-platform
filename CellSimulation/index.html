<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Simulation | 超リアル重力加速度 ＆ 100倍速ピクセル物理シミュレーター</title>
  <meta name="description" content="重力加速度(v_y = v_y + g*dt)、熱伝導(℃)、水面水平流動を現実さながらにリアルタイム物理演算する超高精細シミュレーター。時間停止から100倍速まで自由自在！">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップステータス ＆ 実験ヘッダー -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 50px; padding: 0 1.2rem; display: flex; justify-content: space-between; align-items: center; background: rgba(18,21,32,0.9); backdrop-filter: blur(10px); z-index: 40; border-bottom: 1px solid var(--panel-border);">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span style="font-weight: 900; font-size: 1.1rem; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        🧪 Cell Simulation (Powder Toy Edition)
      </span>
      <span style="font-size: 0.85rem; color: var(--text-sub);">
        選択中: <strong id="current-selected-material-display" style="color:var(--accent-cyan);">水 (Water)</strong>
      </span>
      <span style="font-size: 0.85rem; color: var(--text-sub); margin-left: 0.5rem;">
        進行速度: <strong id="current-time-speed-display" style="color:var(--accent-gold);">1x</strong>
      </span>
    </div>

    <!-- 実験プリセットボタン群 (※alert不使用) -->
    <div style="display: flex; gap: 0.6rem;">
      <button id="btn-preset-lava-water" style="background: linear-gradient(135deg, #ff3366, #00f2fe); color: #fff; border:none; padding:0.4rem 0.8rem; border-radius:8px; font-weight:bold; font-size:0.8rem; cursor:pointer;">🌋 1200℃ 溶岩 ✕ 水 実験</button>
      <button id="btn-preset-human-acid" style="background: linear-gradient(135deg, #f0a096, #a0ff00); color: #000; border:none; padding:0.4rem 0.8rem; border-radius:8px; font-weight:bold; font-size:0.8rem; cursor:pointer;">🚶 人間組織 ✕ 酸 実験</button>
    </div>
  </div>

  <!-- フルピクセル物理キャンバス (最下部にメニューで隠れない固定床を物理生成) -->
  <canvas id="sim-canvas" style="margin-top: 50px;"></canvas>

  <!-- カスタムエレガントトースト通知 (※alertは一切不使用) -->
  <div id="custom-toast" class="custom-toast-notification"></div>

  <!-- 画面下部 メニューバー (「🧪 物質」ボタン ＆ 100倍速タイムコントロール) -->
  <div class="powder-toolbar-bottom">
    
    <!-- 「🧪 物質」ボタン (200種類カタログオープン) -->
    <button id="btn-open-material-catalog" class="btn-open-materials">
      🧪 物質を選択 (全200種類)
    </button>

    <!-- ツールボックス (ブラシサイズ, 100倍速タイムコントロール, 清掃) -->
    <div class="toolbar-actions">
      <!-- ペンサイズ -->
      <div style="display: flex; align-items: center; gap: 0.5rem; background: rgba(0,0,0,0.4); padding: 0.4rem 0.8rem; border-radius: 10px; font-size: 0.8rem;">
        <span>🖌️ ペン径:</span>
        <input type="range" id="slider-brush-size" min="1" max="25" value="5" style="width: 70px;">
        <span id="brush-size-val" style="font-weight: bold; color: var(--accent-cyan);">5 px</span>
      </div>

      <!-- タイムコントロール (0x, 0.5x, 1x, 5x, 10x, 25x, 50x, 100x) -->
      <div style="display: flex; gap: 0.25rem;">
        <button class="time-btn" data-speed="0">⏸️</button>
        <button class="time-btn" data-speed="0.5">0.5x</button>
        <button class="time-btn active" data-speed="1">1x</button>
        <button class="time-btn" data-speed="5">5x</button>
        <button class="time-btn" data-speed="10">10x</button>
        <button class="time-btn" data-speed="25">25x</button>
        <button class="time-btn" data-speed="50">50x</button>
        <button class="time-btn" data-speed="100" style="color:var(--accent-gold);">100x 🚀</button>
      </div>

      <!-- 清掃 -->
      <button id="btn-clear-canvas" style="background: var(--accent-red); color: #fff; border:none; padding:0.5rem 0.9rem; border-radius:8px; font-weight:bold; cursor:pointer;">🧹 クリア</button>
    </div>

  </div>

  <!-- モーダル: 全200種類 物質カタログ ＆ 検索 -->
  <div id="modal-material-catalog" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="font-size: 1.4rem;">🧪 物質・元素カタログ (全200種類)</h3>
        <button class="modal-close-btn" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>

      <!-- 検索入力窓 -->
      <input type="text" id="catalog-search-input" class="catalog-search-bar" placeholder="🔍 物質名・キーワードで検索 (例: 水, 鉄, 酸, 溶岩, 細胞, 火, 人間, ダイヤモンド...)">

      <!-- カテゴリタブ -->
      <div class="catalog-cat-tabs">
        <div class="catalog-cat-tab active" data-cat="ALL">すべて</div>
        <div class="catalog-cat-tab" data-cat="液体">💧 液体</div>
        <div class="catalog-cat-tab" data-cat="固形">🪨 固形・金属</div>
        <div class="catalog-cat-tab" data-cat="粉末">⏳ 粉末</div>
        <div class="catalog-cat-tab" data-cat="気体">☁️ 気体</div>
        <div class="catalog-cat-tab" data-cat="生命">🦠 生命・有機組織</div>
        <div class="catalog-cat-tab" data-cat="エネルギー">🔥 エネルギー</div>
      </div>

      <div id="catalog-count-info" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.8rem;">表示中: 200 / 200 種類</div>

      <!-- 200種類物質カードグリッド -->
      <div id="catalog-materials-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.8rem; max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- スクリプト統合 -->
  <script src="js/elements_database.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sandbox_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
