<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Simulation | The Powder Toy型 超リアルピクセル物理シミュレーター</title>
  <meta name="description" content="溶岩、水、水蒸気、熱量相転移、重力、化学反応、生きている細胞、人間組織をリアルタイムに体験できる本格ピクセル物理サンドボックスシミュレーター。">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップステータス ＆ 実験ヘッダー -->
  <div class="header-bar">
    <div class="header-left">
      <span class="app-title">🧪 Cell Simulation (The Powder Toy Edition)</span>
      <a href="../index.html" class="portal-link">🏠 Versa Game Portal へ戻る</a>
      <span class="status-info">
        選択中: <strong id="current-selected-material-display">💧 水 (Water)</strong>
      </span>
      <span class="status-info">
        速度: <strong id="current-time-speed-display">1x</strong>
      </span>
    </div>

    <!-- リアル実験プリセットボタン群 (※alert不使用) -->
    <div class="preset-buttons">
      <button id="btn-preset-lava-water" class="preset-btn btn-lava">🌋 溶岩✕水 沸騰</button>
      <button id="btn-preset-explosion" class="preset-btn btn-fire">🔥 火薬庫 大爆発</button>
      <button id="btn-preset-acid-corrosion" class="preset-btn btn-acid">🧪 強烈 酸侵食</button>
      <button id="btn-preset-cell-growth" class="preset-btn btn-cell">🦠 細胞自動増殖</button>
      <button id="btn-preset-human-burn" class="preset-btn btn-human">🚶 人体 vs 溶岩・酸</button>
    </div>
  </div>

  <!-- フルピクセル物理キャンバス -->
  <canvas id="sim-canvas"></canvas>

  <!-- クイック元素・物質選択パレット (The Powder Toy スタイル) -->
  <div class="quick-element-bar">
    <button class="elem-btn active" data-id="1" style="--btn-color: #00b4fe;">💧 水</button>
    <button class="elem-btn" data-id="2" style="--btn-color: #ff3c00;">🌋 溶岩</button>
    <button class="elem-btn" data-id="28" style="--btn-color: #c8dcff;">☁️ 蒸気</button>
    <button class="elem-btn" data-id="21" style="--btn-color: #5a5f6e;">🪨 玄武岩</button>
    <button class="elem-btn" data-id="38" style="--btn-color: #ffb400;">🔥 火</button>
    <button class="elem-btn" data-id="36" style="--btn-color: #28c85a;">🌿 植物</button>
    <button class="elem-btn" data-id="33" style="--btn-color: #00ff8c;">🦠 細胞</button>
    <button class="elem-btn" data-id="34" style="--btn-color: #f0a096;">🚶 人間</button>
    <button class="elem-btn" data-id="4" style="--btn-color: #a0ff00;">🧪 酸</button>
    <button class="elem-btn" data-id="13" style="--btn-color: #ebc373;">⏳ 砂</button>
    <button class="elem-btn" data-id="22" style="--btn-color: #8c96a5;">⚙️ 鉄</button>
    <button class="elem-btn" data-id="0" style="--btn-color: #ff4757;">🧹 消しゴム</button>
  </div>

  <!-- カスタムエレガントトースト通知 (※alertは一切不使用) -->
  <div id="custom-toast" class="custom-toast-notification"></div>

  <!-- 画面下部 メニューバー (ツール ＆ タイムコントロール) -->
  <div class="powder-toolbar-bottom">
    
    <!-- 「🧪 全物質」ボタン (200種類カタログオープン) -->
    <button id="btn-open-material-catalog" class="btn-open-materials">
      🧪 全200種類 物質カタログ
    </button>

    <!-- ツールボックス (ペン径 1~30px, 重力逆転, 風吹き, タイムコントロール, 清掃) -->
    <div class="toolbar-actions">
      <!-- ペンサイズ (1px 〜 30px) -->
      <div class="tool-group">
        <span>🖌️ ペン径:</span>
        <input type="range" id="slider-brush-size" min="1" max="30" value="5">
        <span id="brush-size-val">5 px</span>
      </div>

      <!-- 重力逆転 -->
      <button id="btn-toggle-gravity" class="tool-btn">🙃 重力: 通常(下)</button>

      <!-- 風吹き -->
      <button id="btn-toggle-wind" class="tool-btn">🌪️ 風: 無風</button>

      <!-- タイムコントロール (0x, 0.5x, 1x, 5x, 10x, 25x, 50x, 100x) -->
      <div class="time-control-group">
        <button class="time-btn" data-speed="0">⏸️</button>
        <button class="time-btn" data-speed="0.5">0.5x</button>
        <button class="time-btn active" data-speed="1">1x</button>
        <button class="time-btn" data-speed="5">5x</button>
        <button class="time-btn" data-speed="10">10x</button>
        <button class="time-btn" data-speed="25">25x</button>
        <button class="time-btn" data-speed="50">50x</button>
        <button class="time-btn" data-speed="100" style="color:var(--accent-gold);">100x 🚀</button>
      </div>

      <!-- 清掃 -->
      <button id="btn-clear-canvas" class="btn-clear">🧹 クリア</button>
    </div>

  </div>

  <!-- モーダル: 全200種類 物質カタログ ＆ 検索 -->
  <div id="modal-material-catalog" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🧪 物質・元素カタログ (全200種類)</h3>
        <button class="modal-close-btn">&times;</button>
      </div>

      <!-- 検索入力窓 -->
      <input type="text" id="catalog-search-input" class="catalog-search-bar" placeholder="🔍 物質名・キーワードで検索 (例: 水, 鉄, 酸, 溶岩, 細胞, 火, 人間, ダイヤモンド...)">

      <!-- カテゴリタブ -->
      <div class="catalog-cat-tabs">
        <div class="catalog-cat-tab active" data-cat="ALL">すべて</div>
        <div class="catalog-cat-tab" data-cat="液体">💧 液体</div>
        <div class="catalog-cat-tab" data-cat="固形">🪨 固形・金属</div>
        <div class="catalog-cat-tab" data-cat="粉末">⏳ 粉末</div>
        <div class="catalog-cat-tab" data-cat="気体">☁️ 気体</div>
        <div class="catalog-cat-tab" data-cat="生命">🦠 生命・有機組織</div>
        <div class="catalog-cat-tab" data-cat="エネルギー">🔥 エネルギー</div>
      </div>

      <div id="catalog-count-info" class="catalog-count">表示中: 200 / 200 種類</div>

      <!-- 200種類物質カードグリッド -->
      <div id="catalog-materials-grid" class="catalog-grid"></div>
    </div>
  </div>

  <!-- スクリプト統合 -->
  <script src="js/elements_database.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sandbox_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
