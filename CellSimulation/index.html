<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Simulation | The Powder Toy スタイル 元素・物理・生命シミュレーター</title>
  <meta name="description" content="The Powder Toyスタイルのピクセル物理シミュレーター。溶岩と水、火と植物、酸と人間組織、細胞の分裂・成長を直接塗り描いてリアルタイム体験！">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップステータス ＆ 実験プリセットヘッダー -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center; background: rgba(18,21,32,0.85); backdrop-filter: blur(10px); z-index: 40; border-bottom: 1px solid var(--panel-border);">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span style="font-weight: 900; font-size: 1.2rem; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        🧪 Cell Simulation (Powder Toy Edition)
      </span>
      <span style="font-size: 0.85rem; color: var(--text-sub);">
        選択中: <strong id="current-selected-elem-text" style="color:#fff;">砂 (Sand)</strong>
      </span>
    </div>

    <!-- 実験プリセットボタン群 (※alert不使用) -->
    <div style="display: flex; gap: 0.6rem;">
      <button id="btn-preset-lava-water" class="btn-tool" style="background: linear-gradient(135deg, #ff3366, #00f2fe); color: #fff;">🌋 溶岩 ✕ 水 実験</button>
      <button id="btn-preset-human-acid" class="btn-tool" style="background: linear-gradient(135deg, #f0a096, #a0ff00); color: #000;">🚶 人間組織 ✕ 酸 実験</button>
      <button id="btn-open-info-modal" class="btn-tool" style="background: rgba(255,255,255,0.1); color: #fff;">📖 物理ガイド</button>
    </div>
  </div>

  <!-- フルピクセル物理キャンバス -->
  <canvas id="sim-canvas" style="margin-top: 50px;"></canvas>

  <!-- カスタムエレガントトースト通知 (※alertは一切不使用) -->
  <div id="custom-toast" class="custom-toast-notification"></div>

  <!-- 画面下部 The Powder Toy 元素パレット ＆ ツールバー -->
  <div class="powder-toolbar-bottom">
    
    <!-- 元素パレットグリッド -->
    <div id="element-palette-grid" class="element-palette-grid"></div>

    <!-- ツールボックス (ブラシサイズ, 清掃, スピード) -->
    <div class="toolbar-actions">
      <!-- ペンサイズ -->
      <div class="brush-control-box">
        <span>🖌️ ペン径:</span>
        <input type="range" id="slider-brush-size" min="1" max="25" value="4" style="width: 80px;">
        <span id="brush-size-val" style="font-weight: bold; color: var(--accent-cyan);">4 px</span>
      </div>

      <!-- タイムコントロール (Pause, 1x, 5x, 10x) -->
      <div style="display: flex; gap: 0.3rem;">
        <button class="time-btn" data-speed="0">⏸️</button>
        <button class="time-btn active" data-speed="1">1x</button>
        <button class="time-btn" data-speed="5">5x</button>
        <button class="time-btn" data-speed="10">10x 🚀</button>
      </div>

      <!-- 清掃 (※confirm不使用) -->
      <button id="btn-clear-canvas" class="btn-tool" style="background: var(--accent-red); color: #fff;">🧹 クリア</button>
    </div>

  </div>

  <!-- モーダル: 物理ガイド ＆ 反応一覧 -->
  <div id="modal-info" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 style="font-size: 1.4rem;">🧪 元素・物質反応ガイド</h3>
        <button class="modal-close-btn" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div style="font-size: 0.9rem; color: var(--text-sub); line-height: 1.7;">
        <p style="margin-bottom: 0.8rem;"><strong style="color:var(--accent-red);">🌋 溶岩 ✕ 💧 水</strong>: 激しい沸騰で水蒸気を発生させ、固化して硬い「玄武岩」を形成。</p>
        <p style="margin-bottom: 0.8rem;"><strong style="color:var(--accent-gold);">🔥 火 ✕ 🌿 植物 / 🚶 人間組織</strong>: 有機物をリアルタイムに発火・燃焼。</p>
        <p style="margin-bottom: 0.8rem;"><strong style="color:#a0ff00;">🧪 酸 (Acid)</strong>: ほとんどの物質や細胞・人間組織を分解侵食。</p>
        <p style="margin-bottom: 0.8rem;"><strong style="color:var(--accent-green);">🦠 生きている細胞 (Cell) ✕ 💧 水</strong>: 水分を吸収して自己分裂・代謝成長！</p>
      </div>
    </div>
  </div>

  <!-- スクリプト統合 -->
  <script src="js/audio.js"></script>
  <script src="js/sandbox_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
