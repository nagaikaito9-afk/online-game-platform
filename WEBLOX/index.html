<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBLOX | 公式メタバース＆ゲーム制作プラットフォーム</title>
  <meta name="description" content="本物のRoblox（ロブロックス）を完全再現！3Dアバター作成、Obbyアスレチック、WEBLOX Studioでオリジナルの3Dゲームを作って公開しよう！">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="shortcut icon" href="../favicon.png">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js 3Dグラフィックライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 画面1: 🔐 Roblox公式ログイン＆サインアップポータル -->
  <section id="screen-login" class="screen-view active">
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">🧊 WEBLOX</div>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
          メタバースで創造し、共有し、世界中のプレイヤーと遊ぼう！
        </p>
        <div style="text-align: left;">
          <label style="font-size: 0.85rem; font-weight: bold; margin-bottom: 0.3rem; display: block;">ユーザーネーム / メールアドレス</label>
          <input type="text" id="input-username" class="login-input" placeholder="RobloxGamer_99">
          
          <label style="font-size: 0.85rem; font-weight: bold; margin-bottom: 0.3rem; display: block;">パスワード</label>
          <input type="password" id="input-password" class="login-input" placeholder="••••••••">

          <button id="btn-login-submit" class="btn-roblox-primary" style="margin-top: 0.5rem;">ログイン / 新規登録</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Roblox 公式風ナビゲーションバー (ログイン後常時表示) -->
  <header id="main-roblox-nav" class="roblox-nav">
    <div class="nav-brand" id="nav-brand-logo">🧊 WEBLOX</div>
    <div class="nav-links">
      <div id="nav-discover" class="nav-item active">🎮 探す (Discover)</div>
      <div id="nav-avatar" class="nav-item">🛍️ アバターショップ</div>
      <div id="nav-studio" class="nav-item" style="color: var(--roblox-green);">🛠️ WEBLOX Studio (ゲーム制作)</div>
    </div>
    <div class="nav-user">
      <span id="display-webux" style="font-weight: bold; color: var(--roblox-gold);">🪙 500</span>
      <span id="display-username" style="font-weight: bold;">Gamer</span>
      <button id="btn-logout" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.85rem;">ログアウト</button>
    </div>
  </header>

  <!-- 画面2: 🏠 Discover (ゲームダッシュボード) -->
  <section id="screen-dashboard" class="screen-view">
    <div class="dashboard-content">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">🔥 おすすめのゲームワールド</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">世界中のクリエイターが作成した3Dメタバースで遊ぼう！</p>
      
      <div id="discover-games-grid" class="games-grid"></div>
    </div>
  </section>

  <!-- 画面3: 🛍️ 3Dアバターカスタマイズ -->
  <section id="screen-avatar" class="screen-view">
    <div class="dashboard-content">
      <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">🛍️ 3Dアバターエディタ</h2>
      <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 300px; background: var(--roblox-card-bg); padding: 1.5rem; border-radius: 16px;">
          <h3 style="margin-bottom: 1rem;">🎨 アバターカラー選択</h3>
          <div id="avatar-colors-selector" style="display: flex; gap: 1rem; flex-wrap: wrap;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 画面4: 🛠️ WEBLOX Studio (3Dゲーム制作エンジン) -->
  <section id="screen-studio" class="screen-view">
    <div class="studio-container">
      <div class="studio-sidebar">
        <h3 style="font-size: 1.1rem; color: var(--roblox-green);">🛠️ Studio ツールボックス</h3>
        <div style="font-size: 0.85rem; color: var(--text-secondary);">パーツを追加して3D世界を構築！</div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
          <button class="studio-add-part-btn btn-roblox-primary" data-part="block">📦 ブロック追加</button>
          <button class="studio-add-part-btn btn-roblox-primary" data-part="sphere" style="background:#ffb703; color:#000;">🔮 球体追加</button>
          <button class="studio-add-part-btn btn-roblox-primary" data-part="cylinder" style="background:#00ff87; color:#000;">🛢️ シリンダー追加</button>
          <button class="studio-add-part-btn btn-roblox-primary" data-part="spawn" style="background:#38b000;">🏁 スポーン地点追加</button>
          <button class="studio-add-part-btn btn-roblox-primary" data-part="killblock" style="background:#d90429;">🔥 マグマキルブロック</button>
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 1rem 0;">

        <div id="studio-selected-info" style="font-size: 0.85rem; color: var(--text-secondary);">パーツを選択していません</div>

        <button id="btn-publish-studio-game" class="btn-roblox-primary" style="margin-top: auto; background: linear-gradient(135deg, var(--roblox-green), #00b4d8);">🚀 ゲームを公開 (Publish)</button>
      </div>

      <div class="studio-viewport">
        <canvas id="studio-canvas"></canvas>
        
        <div class="studio-toolbar">
          <button class="studio-tool-btn" data-tool="select">🔍 選択 (Select)</button>
          <button class="studio-tool-btn" data-tool="delete" style="background:#d90429;">🗑️ 削除 (Delete)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 画面5: 🎮 3Dゲームプレイ画面 -->
  <section id="screen-gameplay" class="screen-view">
    <canvas id="weblox-canvas"></canvas>
    
    <div style="position: absolute; top: 1rem; left: 1rem; z-index: 20;">
      <button id="btn-back-to-dash" class="btn-roblox-primary" style="padding: 0.5rem 1rem; width: auto;">🏠 Robloxメニューに戻る</button>
    </div>
    
    <div style="position: absolute; top: 1rem; right: 1rem; z-index: 20; background: rgba(0,0,0,0.6); padding: 0.5rem 1rem; border-radius: 20px;">
      <span id="current-gameplay-title" style="font-weight: bold; color: var(--roblox-gold);">WEBLOX Game</span>
    </div>
  </section>

  <!-- WEBLOX スクリプト群 -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/world.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
