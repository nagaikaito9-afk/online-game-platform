<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Planet | 植物惑星テラフォーミングシミュレーター</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h2 style="background: linear-gradient(135deg, #22c55e, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🌱 Plant Planet (植物惑星開発)</h2>
    <a href="../index.html" class="portal-link">🏠 Versa Game Portal へ戻る</a>
  </div>

  <div class="main-container">
    <canvas id="planet-canvas" width="600" height="450"></canvas>

    <div style="display: flex; gap: 2rem; background: rgba(0,0,0,0.5); padding: 0.8rem 1.5rem; border-radius: 12px; border: 1px solid rgba(34, 197, 94, 0.3);">
      <div>💧 水分量: <strong id="stat-water" style="color: #06b6d4;">50%</strong></div>
      <div>💨 酸素濃度: <strong id="stat-o2" style="color: #22c55e;">20%</strong></div>
      <div>🌿 植物数: <strong id="stat-plants" style="color: #eab308;">10 本</strong></div>
    </div>

    <div class="controls">
      <button id="btn-water" class="btn">💧 雨を降らせる (播種・水補給)</button>
      <button id="btn-sun" class="btn">☀️ 太陽光照射 (光合成活性)</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
