<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Planet | 高精細ドット育成 ＆ 物理実験シミュレーター</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- フルスクリーン ゲームキャンバス -->
  <canvas id="game-canvas"></canvas>

  <!-- トップ ヘッダー -->
  <div class="header-bar">
    <div class="brand">
      <h1>🌱 Plant Planet</h1>
    </div>
    <div id="current-selection-badge" class="current-selection-badge">
      <span>選択中:</span> 🍅 トマト (種植え)
    </div>
    <a href="../index.html" class="portal-link portal-btn">🏠 Versa Game Portal へ戻る</a>
  </div>

  <!-- メイン ツールバー (上部中央) -->
  <div class="toolbar-container">
    <!-- 種カタログ呼び出しボタン -->
    <button id="seed-catalog-trigger" class="seed-catalog-trigger">
      🌱 種カタログ (全50種)
    </button>

    <div class="divider"></div>

    <!-- 10種類の実験ツール -->
    <div class="tool-group">
      <button class="tool-btn" data-tool="rain" data-tooltip="🌧️ 雨雲 (水分/成長活性)">🌧️</button>
      <button class="tool-btn" data-tool="water_drop" data-tooltip="💧 水 (ピンポイント散水)">💧</button>
      <button class="tool-btn" data-tool="lava" data-tooltip="🌋 溶岩 (炭化/爆発崩壊)">🌋</button>
      <button class="tool-btn" data-tool="sunbeam" data-tooltip="☀️ 太陽光 (ドット光合成/芽吹き)">☀️</button>
      <button class="tool-btn" data-tool="fertilizer" data-tooltip="🧪 栄養剤 (多重成長/太さ倍増)">🧪</button>
      <button class="tool-btn" data-tool="prune" data-tooltip="✂️ 剪定ハサミ (ドット精密切断)">✂️</button>
      <button class="tool-btn" data-tool="freeze" data-tooltip="❄️ 氷結 (ドット硬化/凍結)">❄️</button>
      <button class="tool-btn" data-tool="tornado" data-tooltip="🌪️ 竜巻 (強風でしならせる)">🌪️</button>
      <button class="tool-btn" data-tool="acid" data-tooltip="☣️ 酸性雨 (紫腐食/ポロポロ崩落)">☣️</button>
      <button class="tool-btn" data-tool="eraser" data-tooltip="🧹 消去 (ドット除外)">🧹</button>
    </div>

    <div class="divider"></div>

    <!-- 倍速コントローラー -->
    <div class="speed-control">
      <button class="speed-btn" data-speed="0">PAUSE</button>
      <button class="speed-btn active" data-speed="1.0">1x</button>
      <button class="speed-btn" data-speed="5.0">5x</button>
      <button class="speed-btn" data-speed="20.0">20x</button>
      <button class="speed-btn" data-speed="100.0">100x</button>
      <button class="speed-btn" data-speed="500.0">500x</button>
    </div>
  </div>

  <!-- 種カタログ モーダル -->
  <div id="seed-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🌱 種カタログ (全50種類以上)</h2>
        <button id="modal-close-btn" class="modal-close-btn">✕</button>
      </div>

      <!-- カテゴリタブ -->
      <div class="category-tabs">
        <button class="tab-btn active" data-cat="all">すべて</button>
        <button class="tab-btn" data-cat="tree">🌲 樹木</button>
        <button class="tab-btn" data-cat="crop">🍅 野菜・果物</button>
        <button class="tab-btn" data-cat="flower">🌸 花卉・草本</button>
        <button class="tab-btn" data-cat="special">🌵 珍種・ファンタジー</button>
      </div>

      <!-- 種カード一覧グリッド -->
      <div id="seed-grid" class="seed-grid">
        <!-- JavaScriptで動的生成 -->
      </div>
    </div>
  </div>

  <!-- 下部 操作ヒントバー -->
  <div class="hint-bar">
    <div class="hint-item">
      <span class="hint-key">右クリック長押し</span> 画面無限移動 (カメラパン)
    </div>
    <div class="hint-item">
      <span class="hint-key">左クリック</span> 種を植える / ツール使用
    </div>
    <div class="hint-item">
      <span class="hint-key">マウスホイール</span> 拡大・縮小ズーム
    </div>
  </div>

  <!-- スクリプト類 -->
  <script src="js/plantData.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/experimentEngine.js"></script>
  <script src="js/plantEngine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
