<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature 3D | 地球進化 ＆ 宇宙文明クロニクル (全50ステージ3D観察)</title>
  <meta name="description" content="46億年前の地球誕生から生命の出現、恐竜の時代、人類文明、そして未来の宇宙開拓まで全50ステージを3Dでゆっくり自由拡大観察！視点切り替え(地球/地形/詳細/細胞)機能、10000倍速、写真・動画保存機能搭載。">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js ＆ OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- トップコントロールバー -->
  <div class="top-bar">
    <div class="brand-logo">
      <span>🪐 Nature 3D: 地球進化 ＆ 宇宙文明クロニクル</span>
    </div>

    <!-- 👁️ 4段階 視点モード切り替えボタンパレット -->
    <div class="view-mode-bar">
      <span style="font-size:0.78rem; color:var(--text-sub);">👁️ 視点モード:</span>
      <button class="view-btn active" data-view="1">🌍 1: 地球観察</button>
      <button class="view-btn" data-view="2">🏔️ 2: 地形観察</button>
      <button class="view-btn" data-view="3">🧍 3: 詳細観察</button>
      <button class="view-btn" data-view="4">🔬 4: 細胞規模</button>
    </div>

    <!-- タイムコントロール (0x ～ 10000x) -->
    <div class="speed-bar">
      <span style="font-size: 0.78rem; color: var(--text-sub);">進行速度:</span>
      <button class="speed-btn" data-speed="0">⏸️ 0x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="10">10x</button>
      <button class="speed-btn" data-speed="100">100x</button>
      <button class="speed-btn" data-speed="1000">1000x</button>
      <button class="speed-btn" data-speed="10000" style="color:var(--accent-gold);">10000x 🚀</button>
    </div>

    <!-- キャプチャ ＆ 録画保存ツール -->
    <div class="media-actions">
      <button id="btn-snapshot" class="media-btn snapshot">📸 写真保存</button>
      <button id="btn-record" class="media-btn record">🎥 動画録画</button>
    </div>
  </div>

  <!-- メイン 3D キャンバス -->
  <canvas id="nature-canvas"></canvas>

  <!-- 現在のステージ情報カード (画面左上) -->
  <div class="stage-info-card">
    <div class="stage-header">
      <span id="stage-number-badge" class="badge">Stage 1 / 50</span>
      <span id="stage-era-text" class="era">46億年前</span>
    </div>
    <h2 id="stage-title-text" class="title">地球誕生 ＆ マグマオーシャン</h2>
    <p id="stage-desc-text" class="desc">微惑星の衝突エネルギーにより、誕生直後の地球全表層が灼熱のマグマの海で覆われていた時代。大気は二酸化炭素と水蒸気で満ちている。</p>
  </div>

  <!-- 操作ガイド (画面右上) -->
  <div class="controls-guide">
    <div>👁️ <strong>キー 1/2/3/4</strong>: 視点切り替え</div>
    <div>🖱️ <strong>左ドラッグ</strong>: 視点3D回転</div>
    <div>📜 <strong>ホイール</strong>: 拡大・縮小</div>
    <div>🖱️ <strong>右ドラッグ</strong>: 平行移動</div>
  </div>

  <!-- トースト通知 -->
  <div id="custom-toast" class="custom-toast"></div>

  <!-- ボトムステージコントロールバー (全50ステージ選択 ＆ スライダー) -->
  <div class="bottom-bar">
    <button id="btn-prev-stage" class="nav-stage-btn">◀ 前の時代</button>
    
    <div class="stage-slider-container">
      <input type="range" id="stage-range-slider" min="1" max="50" value="1" step="1">
      <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-sub); margin-top:0.2rem;">
        <span>Stage 1 (地球誕生)</span>
        <span>Stage 25 (氷河期)</span>
        <span>Stage 50 (銀河文明)</span>
      </div>
    </div>

    <button id="btn-next-stage" class="nav-stage-btn">次の時代 ▶</button>
    <button id="btn-open-stage-modal" class="btn-catalog">📚 全50ステージ一覧</button>
  </div>

  <!-- モーダル: 全50ステージ一覧選択 -->
  <div id="modal-stages" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem;">
        <h3 style="font-size:1.4rem; color:var(--accent-cyan);">📚 全50ステージ 地球 ＆ 生命 ＆ 文明一覧</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div id="stages-grid" class="stages-grid"></div>
    </div>
  </div>

  <!-- スクリプト統合 -->
  <script src="js/audio.js"></script>
  <script src="js/nature_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
